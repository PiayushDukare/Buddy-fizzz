<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Buddy Fizz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", system-ui, sans-serif;
        min-height: 100vh;
        color: #143a24;
        display: grid;
        place-items: center;
        padding: 1.2rem;
        background: linear-gradient(135deg, #143a24, #2e7d32);
      }
      .auth {
        background: #fffaf0;
        width: min(100%, 26rem);
        border-radius: 1.3rem;
        box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.3);
        padding: 2.6rem 2.2rem;
        text-align: center;
      }
      .auth__logo {
        font-family: "Baloo 2", cursive;
        font-weight: 800;
        font-size: 2.1rem;
        line-height: 0.85;
        color: #143a24;
      }
      .auth__logo span {
        color: #a4d233;
      }
      .auth__sub {
        color: #6b7a6e;
        font-size: 0.9rem;
        margin: 0.6rem 0 1.8rem;
      }
      .field {
        text-align: left;
        margin-bottom: 1.1rem;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      .field-input {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: #fff;
        border: 1px solid #e7ece3;
        border-radius: 0.7rem;
        padding: 0 1rem;
      }
      .field-input:focus-within {
        border-color: #7cb342;
      }
      .field-input i {
        color: #2e7d32;
      }
      .field-input input {
        flex: 1;
        border: none;
        outline: none;
        padding: 0.85rem 0;
        font-family: inherit;
        font-size: 0.95rem;
        background: none;
      }
      .btn-submit {
        width: 100%;
        border: none;
        border-radius: 0.7rem;
        padding: 0.9rem;
        background: #143a24;
        color: #fff;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .btn-submit[disabled] {
        opacity: 0.6;
        pointer-events: none;
      }
      .msg {
        font-size: 0.85rem;
        padding: 0.7rem 0.9rem;
        border-radius: 0.6rem;
        margin-bottom: 1.1rem;
        display: none;
      }
      .msg--error {
        background: #fbe0e0;
        color: #b02a2a;
        display: block;
      }
      .msg--ok {
        background: #dff3df;
        color: #1f7a34;
        display: block;
      }
      .auth__back {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.82rem;
        color: #6b7a6e;
      }
      .auth__back a {
        color: #2e7d32;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <form class="auth" id="reset-form">
      <div class="auth__logo">Buddy<span>Fizz</span></div>
      <p class="auth__sub">Choose a new password</p>
      <div class="msg" id="msg"></div>
      <div class="field">
        <label for="password">New Password</label>
        <div class="field-input">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            placeholder="Min 8 characters"
            minlength="8"
            required
            autocomplete="new-password"
          />
        </div>
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <div class="field-input">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="confirm"
            placeholder="Re-enter password"
            minlength="8"
            required
            autocomplete="new-password"
          />
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit">
        Reset Password
      </button>
      <p class="auth__back">Remembered it? <a href="login.html">Sign in</a></p>
    </form>

    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const form = document.getElementById("reset-form");
      const msg = document.getElementById("msg");
      const submit = document.getElementById("submit");

      if (!token) {
        msg.textContent =
          "This reset link is invalid. Please request a new one.";
        msg.className = "msg msg--error";
        submit.disabled = true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        msg.className = "msg";
        if (password !== confirm) {
          msg.textContent = "The two passwords don't match.";
          msg.className = "msg msg--error";
          return;
        }
        submit.disabled = true;
        submit.textContent = "Saving…";
        try {
          const res = await fetch("api/auth/reset.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok)
            throw new Error(data.error || "Could not reset password");
          msg.textContent = data.message + " Redirecting to sign in…";
          msg.className = "msg msg--ok";
          setTimeout(() => (location.href = "login.html"), 1800);
        } catch (err) {
          msg.textContent = err.message;
          msg.className = "msg msg--error";
          submit.disabled = false;
          submit.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
